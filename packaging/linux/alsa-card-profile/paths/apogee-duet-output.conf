; Apogee Duet speaker output. "Output Volume Control" is the USB Audio Class
; view of the speaker level and mute, so the sink volume and Apogee Control
; stay in sync. The headphone level has no USB Audio Class control.

[General]
description = Speakers
priority = 100

[Element Output Volume Control]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
