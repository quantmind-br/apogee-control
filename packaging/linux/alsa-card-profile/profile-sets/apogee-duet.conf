; ALSA card profile set for the Apogee Duet (USB), selected by the udev rule
; in 70-apogee-duet.rules.
;
; The Duet plays one 4-channel stream (outputs 1-2 and 3-4). The default
; profile set maps it to analog-surround-40, so stereo is upmixed into outputs
; 3-4 and the volume is applied in software. Here outputs 3-4 are auxiliary
; channels, and the sink volume and mute drive the speaker level.

[General]
auto-profiles = no

[Mapping analog-stereo-out]
description = Analog Stereo 1/2
device-strings = hw:%f
channel-map = front-left,front-right,aux0,aux1
paths-output = apogee-duet-output
direction = output

[Mapping analog-stereo-in]
description = Analog Stereo
device-strings = hw:%f
channel-map = front-left,front-right
direction = input

[Profile output:analog-stereo-out+input:analog-stereo-in]
description = Analog Stereo Duplex
output-mappings = analog-stereo-out
input-mappings = analog-stereo-in
priority = 100

[Profile output:analog-stereo-out]
description = Analog Stereo Output
output-mappings = analog-stereo-out
priority = 90

[Profile input:analog-stereo-in]
description = Analog Stereo Input
input-mappings = analog-stereo-in
priority = 80
