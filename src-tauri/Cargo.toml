[package]
name = "apogee-control"
version = "2.0.0"
description = "Control panel for the Apogee Duet (USB) on Linux"
authors = ["quantmind-br <dsrodrigues20@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/quantmind-br/apogee-control"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusb = "0.9"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
