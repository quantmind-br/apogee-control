<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apogee Duet Control</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header" data-tauri-drag-region="deep">
    <div class="identity">
      <h1>Apogee Duet</h1>
      <p id="device-label">USB control panel</p>
    </div>
    <div class="header-actions">
      <button id="resync" class="icon-button" type="button" title="Read every setting from the device again" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-14.3-4.9M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9M20 20v-4h-4"/>
        </svg>
        <span>Resync</span>
      </button>
      <span id="status" class="status" data-tone="pending">
        <span class="status-dot"></span>
        <span id="status-text">Connecting</span>
      </span>
      <div class="window-controls">
        <button id="minimize" class="window-button" type="button" aria-label="Minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        </button>
        <button id="close" class="window-button window-button-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav id="nav" class="nav-rail" aria-label="Panel" hidden>
      <p class="caption">Panel</p>
      <button class="nav-item" type="button" data-page="inputs" aria-current="page">Inputs</button>
      <button class="nav-item" type="button" data-page="outputs">Outputs</button>
      <button class="nav-item" type="button" data-page="mixer">Mixer</button>
    </nav>
    <main id="content"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
